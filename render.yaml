# Free-plan config: no persistent disk, so the SQLite DB and taxonomy edits reset
# on every redeploy/restart. For durable data, use plan: starter and add a disk
# (mountPath /var/data) plus the CAARYA_DATA_DIR=/var/data env var.
services:
  - type: web
    name: caarya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CAARYA_RELOAD
        value: "0"
