services:
  - type: web
    name: caarya
    runtime: python
    plan: starter            # persistent disks need a paid instance
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CAARYA_RELOAD
        value: "0"
      - key: CAARYA_DATA_DIR
        value: /var/data
    disk:
      name: caarya-data
      mountPath: /var/data
      sizeGB: 1
