# Free plan. All data (students, profiles, taxonomy edits) lives in Neon Postgres via
# DATABASE_URL, so redeploys and restarts lose nothing. Set DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: caarya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
