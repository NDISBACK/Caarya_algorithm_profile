<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caarya — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('caarya-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <canvas id="bends-bg" class="no-print" aria-hidden="true"></canvas>
  <button class="theme-toggle no-print" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  <div class="admin">
    <header class="admin-top">
      <div class="brand"><strong>caarya</strong><span>admin</span></div>
      <nav class="view-toggle" id="tabs" aria-label="Sections"></nav>
      <a class="btn btn-ghost" id="student-link" href="http://localhost:5000" target="_blank" rel="noopener">Preview as a student</a>
    </header>
    <div id="notice"></div>
    <main id="panel"><div class="loading">Loading the taxonomy…</div></main>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/admin.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/bends.js"></script>
</body>
</html>
