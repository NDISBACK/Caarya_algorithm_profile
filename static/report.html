<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caarya — Profile report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script>
    // Avoids a flash of the wrong theme: applies a remembered override,
    // if any, before the stylesheet paints. Falls through to the OS
    // preference (handled in CSS) when nothing is stored.
    (function () {
      try {
        var t = localStorage.getItem('caarya-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <canvas id="bends-bg" class="no-print" aria-hidden="true"></canvas>
  <button class="theme-toggle no-print" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
  <div class="report">
    <div id="boot" class="loading">Loading the report…</div>
    <div id="report" hidden></div>
  </div>
  <script src="/static/js/api.js"></script>
  <!-- report.js builds the "Complete your profile" form with Fields.* -->
  <script src="/static/js/fields.js"></script>
  <script src="/static/js/report.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/bends.js"></script>
</body>
</html>
